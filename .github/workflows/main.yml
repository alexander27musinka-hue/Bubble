name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать zip из репозитория
        run: |
          ZIP=$(ls *.zip | head -n1)
          echo "Распаковываю $ZIP"
          mkdir -p _src
          unzip -o "$ZIP" -d _src
          SETTINGS=$(find _src -name settings.gradle | head -n1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Сборка debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BubblePop-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
